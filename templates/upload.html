{% extends "base.html" %}

{% block title %}Upload Image - Smart Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center mb-0">Upload Image</h2>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="image" class="form-label">Choose an image</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>

                {% if uploaded_file_url %}
                <div class="mt-4">
                    <h3>Uploaded Image:</h3>
                    <img src="{{ uploaded_file_url }}" class="img-fluid mb-3" alt="Uploaded image">
                    <form action="{{ url_for('detect_faces') }}" method="post">
                        <input type="hidden" name="image_path" value="{{ uploaded_file_url }}">
                        <button type="submit" class="btn btn-success">Detect Faces</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
